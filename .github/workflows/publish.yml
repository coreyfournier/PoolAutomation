#Builds the image for the raspberry pi (32 and 64 bit) and publishes it to the GitHub container registry.
#Watchtower on the pi picks up the new image and restarts the container. See deploy/ and the Readme.
#Every build gets a build number (year.month.day.run, ex: 2026.10.25.42). It's a tag on the image and is shown
#at the bottom of the web page, so it's easy to see which build the pi is running.
name: Build and publish

#Pull requests only run the tests. Master requires them to pass before a merge.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

#A newer push makes an in progress build pointless
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pool-automation

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      #Worked out once so every job uses the same number. The 32 bit build can run past midnight.
      - id: version
        run: echo "version=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest Tests -q

  #Builds one image per architecture, each with its own tags (latest-armv7, sha-abc1234-armv7, latest-arm64 ...)
  #so a specific one can be pinned. The merge job then combines them under latest / sha-abc1234, which pulls
  #the right one for whatever pi it's on.
  publish:
    needs: test
    #Never publish from a pull request. Only what has been merged to master gets deployed.
    if: github.event_name != 'pull_request'
    #Waits for approval before publishing, because a published image is deployed straight to the pi.
    #Reviewers are set in GitHub > Settings > Environments > production. One approval covers both architectures.
    environment: production
    strategy:
      #A failure in one architecture shouldn't throw away the other
      fail-fast: false
      matrix:
        include:
          #32 bit pi OS. GitHub has no runner for it, so the python layer is built under emulation (slow).
          #Uses the default cache scope so it keeps the cache from builds made before the matrix existed.
          - platform: linux/arm/v7
            suffix: armv7
            runner: ubuntu-latest
            emulate: true
            cacheScope: buildkit
          #64 bit pi OS. Builds natively on an arm runner (fast).
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
            emulate: false
            cacheScope: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - if: matrix.emulate
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=-${{ matrix.suffix }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.test.outputs.version }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: APP_VERSION=${{ needs.test.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cacheScope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cacheScope }}

  merge:
    needs: [test, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine the architectures under one tag
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:$SHA_TAG" \
            "$IMAGE:$SHA_TAG-armv7" \
            "$IMAGE:$SHA_TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"
