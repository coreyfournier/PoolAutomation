#Builds the 32 bit arm (arm/v7) image for the raspberry pi and publishes it to the GitHub container registry.
#Watchtower on the pi picks up the new image and restarts the container. See deploy/ and the Readme.
name: Build and publish

#Pull requests only run the tests. Master requires them to pass before a merge.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

#A newer push makes an in progress build pointless
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pool-automation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest Tests -q

  publish:
    needs: test
    #Never publish from a pull request. Only what has been merged to master gets deployed.
    if: github.event_name != 'pull_request'
    #Waits for approval before publishing, because a published image is deployed straight to the pi.
    #Reviewers are set in GitHub > Settings > Environments > production.
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      #The pi is 32 bit arm and GitHub has no runner for that, so the python layer is built under emulation
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
