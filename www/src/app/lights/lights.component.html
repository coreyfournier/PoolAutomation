<div class="tile__header">
    <h2 class="tile__title">Lights</h2>
</div>
<div class="tile__body">
    <div class="control-list">
        <div class="control-item" *ngFor="let light of lights">
            <span class="control-label">{{light.displayName}}</span>
            <select id="light-scene-{{light.name}}"
                    (change)="sceneChanged(light, $event)"
                    class="form-control">
                <option value="-">-</option>
                <option value="off">Off</option>
                <option *ngFor="let scene of light.lightScenes" [value]="scene.name">
                    {{scene.name}} - {{scene.description}}
                </option>
            </select>
        </div>
    </div>
</div>
