
<div class="panel panel-default">
    <div class="panel-heading">
        <h3 class="panel-title">Stats</h3>
    </div>
    <div class="panel-body">
        <div class="stats-controls" [formGroup]="myGroup">
            <label class="stats-label" for="stats-date">Date</label>
            <mat-form-field appearance="outline" subscriptSizing="dynamic" class="date-picker">
                <input id="stats-date" matInput 
                    formControlName="start" 
                    (dateChange)="updateTemperatureChart($event.value)" 
                    [matDatepicker]="picker">
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
        </div>

        <div id="temperature-chart" >            
            <apx-chart    
                [series]="chartOptions.series"
                [chart]="chartOptions.chart"
                [xaxis]="chartOptions.xaxis"
                [title]="chartOptions.title"
            ></apx-chart>
        </div>
    </div>
</div>
