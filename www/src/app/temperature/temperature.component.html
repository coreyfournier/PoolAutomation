<div class="tile__header">
    <h2 class="tile__title">Temperature</h2>
</div>
<div class="tile__body">
    <div class="sensor-grid">
        <div class="sensor-card" *ngFor="let sensor of sensors">
            <div class="sensor-card__name">{{sensor.name}}</div>
            <div class="sensor-card__value">{{sensor.temp}}{{sensor.unit}}</div>
        </div>
    </div>
</div>
